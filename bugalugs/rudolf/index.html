<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Professor Rudolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Cormorant+Garamond:ital,wght@1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one centred stage — owl on a felt-shadow, speech bubble to his right (above him on phones), name plate and phase controls beneath. Bugalugs palette. */
:root {
  --bone: #f1ece1;          /* Bugalugs Bone — page ground */
  --paper: #f8f5ee;
  --ink: #1c1b19;           /* Wattle Charcoal */
  --muted: #6b4a36;         /* Gum Bark */
  --brass: #a9863e;         /* Weathered Brass */
  --brass-bright: #c9a227;
  --line: rgba(28, 27, 25, 0.18);
  --bubble-bg: #1c1b19;
  --bubble-fg: #f1ece1;
  --shadow: rgba(28, 27, 25, 0.22);
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-voice: "Cormorant Garamond", Georgia, serif;
  --font-body: "Work Sans", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bone: #1c1b19; --paper: #24221f; --ink: #f1ece1; --muted: #c9b79b;
    --brass: #c9a227; --brass-bright: #d9b443; --line: rgba(241, 236, 225, 0.2);
    --bubble-bg: #f1ece1; --bubble-fg: #1c1b19; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bone: #1c1b19; --paper: #24221f; --ink: #f1ece1; --muted: #c9b79b;
  --brass: #c9a227; --brass-bright: #d9b443; --line: rgba(241, 236, 225, 0.2);
  --bubble-bg: #f1ece1; --bubble-fg: #1c1b19; --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bone);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 24px 48px;
}
.page { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; justify-items: center; }

/* ---------- stage ---------- */
.stage {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}
.owl-wrap { position: relative; width: min(340px, 62vw); max-width: 100%; }
.owl {
  position: relative;
  width: 100%;
  aspect-ratio: 1205 / 1306;
  cursor: pointer;
  outline: none;
}
.owl:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 6px; border-radius: 8px; }
.ground {
  position: absolute; left: 22%; right: 22%; top: 88.5%; height: 5.5%;
  background: radial-gradient(closest-side, var(--shadow), transparent);
  transform-origin: 50% 50%;
}
.rig { position: absolute; inset: 0; transform-origin: 50% 91%; will-change: transform; }
.breath { position: absolute; inset: 0; transform-origin: 50% 91%; animation: breathe 3.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.008, 1.016); } }
.layer { position: absolute; display: block; max-width: none; pointer-events: none; user-select: none; }
.base  { left: 0; top: 0; width: 100%; }
.head  { left: 0; top: 0; width: 100%; height: 53.599%; transform-origin: 49.96% 92.86%; }
.head img { position: absolute; inset: 0; width: 100%; height: 100%; }
.lids  { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wingL { left: 15.934%; top: 56.891%; width: 15.934%; transform-origin: 91.67% 12.32%; }
.wingR { left: 68.465%; top: 57.044%; width: 15.934%; transform-origin: 8.85% 13.21%; }
.cape  { left: 14.274%; top: 45.942%; width: 70.871%; }

/* ---------- speech bubble ---------- */
.bubble {
  position: absolute;
  left: 84%;
  bottom: 60%;
  width: min(290px, 74vw);
  background: var(--bubble-bg);
  color: var(--bubble-fg);
  border-radius: 22px;
  padding: 18px 22px 20px;
  transform-origin: 0% 100%;
  transform: scale(0);
  opacity: 0;
  z-index: 3;
  box-shadow: 0 10px 30px -14px var(--shadow);
}
.bubble::after { /* tail, aimed at the beak */
  content: "";
  position: absolute;
  left: -26px; bottom: -14px;
  width: 46px; height: 34px;
  background: var(--bubble-bg);
  clip-path: path("M46 0 C 34 16, 18 28, 0 34 C 22 32, 40 24, 46 14 Z");
}
.bubble p {
  margin: 0;
  font-family: var(--font-voice);
  font-style: italic;
  font-weight: 500;
  font-size: 1.32rem;
  line-height: 1.28;
  text-wrap: pretty;
}
.bubble .w { opacity: 0.12; transition: opacity 0.18s ease; }
.bubble .w.on { opacity: 1; }
.bubble em { font-family: var(--font-display); font-style: italic; font-size: 0.86em; letter-spacing: 0.01em; color: var(--brass-bright); }
.bubble.small { width: auto; white-space: nowrap; padding: 12px 20px 14px; }
.bubble.small p { font-size: 1.5rem; }

/* ---------- name plate ---------- */
.plate { display: grid; justify-items: center; gap: 10px; text-align: center; margin-top: -8px; }
.plate .rule { width: 44px; height: 1px; background: var(--brass); }
.plate h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(2rem, 6vw, 2.75rem);
  letter-spacing: 0.01em;
  line-height: 1.05;
  text-wrap: balance;
}
.plate .eyebrow {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted);
}

/* ---------- controls ---------- */
.controls { display: grid; gap: 14px; justify-items: center; width: 100%; }
.phases { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.btn {
  font: 500 0.7rem/1 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.btn:hover { border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bone); border-color: var(--ink); }
.btn.primary { border-color: var(--ink); }
.voice-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; }
.voice-row label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
.voice-row select {
  font: 400 0.85rem var(--font-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); padding: 8px 10px; max-width: min(320px, 90vw);
}
.note { font-size: 0.8rem; color: var(--muted); max-width: 52ch; text-align: center; line-height: 1.5; margin: 0; min-height: 1.5em; }

@media (max-width: 840px) {
  .stage { padding-top: 190px; }
  .owl-wrap { width: min(280px, 70vw); }
  .bubble {
    --bw: min(340px, calc(100vw - 32px));
    left: 50%; bottom: calc(100% + 18px); width: var(--bw); margin-left: calc(var(--bw) / -2);
    transform-origin: 50% 100%;
  }
  .bubble::after { left: 50%; bottom: -16px; margin-left: -13px; width: 26px; height: 18px;
    clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .bubble.small { --bw: 150px; text-align: center; }
}
@media (prefers-reduced-motion: reduce) { .breath { animation: none; } }
</style>
</head>

  <div class="plate">
    <span class="rule" aria-hidden="true"></span>
    <h1>Professor Rudolf</h1>
    <span class="eyebrow">Bugalugs</span>
  </div>

  <div class="controls">
    <div class="phases" role="group" aria-label="Animations">
      <button class="btn primary" id="speakBtn" type="button">Hear him say it</button>
      <button class="btn" data-phase="arrive" type="button">Arrive</button>
      <button class="btn" data-phase="flap" type="button">Flap</button>
      <button class="btn" data-phase="hop" type="button">Hop</button>
      <button class="btn" data-phase="ponder" type="button">Ponder</button>
      <button class="btn" data-phase="nein" type="button">Nein, nein</button>
      <button class="btn" data-phase="lecture" type="button">Lecture</button>
    </div>
    <div class="voice-row">
      <label for="voiceSel">Voice</label>
      <select id="voiceSel"><option>Looking for German voices…</option></select>
      <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
    <p class="note" id="note"></p>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rig = $('rig'), head = $('head'), wingL = $('wingL'), wingR = $('wingR');
  const ground = $('ground'), bubble = $('bubble'), line = $('line'), note = $('note');
  const lids = [...document.querySelectorAll('.lid')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The line, shown with his accent on the page; spoken in plain English so a German voice supplies the accent.
  const shown  = ['Come','now,','Sophie!','Zere','are','zings','to','be','done —','und','zat','does','not','mean','anozzer','<em>Scotch','Finger!</em>'];
  const spoken = ['Come','now,','Sophie!','There','are','things','to','be','done,','and','that','does','not','mean','another','Scotch','Finger!'];

  const EASE = 'cubic-bezier(.45,0,.55,1)';
  const anim = (el, frames, opts) => {
    const a = el.animate(frames, { duration: reduce ? 1 : opts.duration, easing: opts.easing || EASE, fill: 'forwards', iterations: reduce ? 1 : (opts.iterations || 1), delay: reduce ? 0 : (opts.delay || 0) });
    return a.finished.catch(() => {});
  };
  const wait = (ms) => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const rest = (el, t = 'none') => anim(el, [{ transform: t }], { duration: 260 });

  /* ---- wings: left wing lifts clockwise, right wing anticlockwise ---- */
  const flapFrames = (side, amp) => {
    const s = side === 'L' ? 1 : -1;
    return [
      { transform: 'rotate(0deg)' },
      { transform: `rotate(${s * amp}deg) scaleY(.96)`, offset: .45 },
      { transform: 'rotate(0deg)' }
    ];
  };
  const flapWings = (n, speed = 300, amp = 34) => Promise.all([
    anim(wingL, flapFrames('L', amp), { duration: speed, iterations: n }),
    anim(wingR, flapFrames('R', amp), { duration: speed, iterations: n })
  ]);

  const blink = async (times = 1) => {
    for (let i = 0; i < times; i++) {
      await Promise.all(lids.map(l => l.animate(
        [{ transform: 'translateY(-120px)' }, { transform: 'translateY(55px)', offset: .45 }, { transform: 'translateY(55px)', offset: .55 }, { transform: 'translateY(-120px)' }],
        { duration: 170, easing: 'ease-in-out' }).finished.catch(() => {})));
      if (i < times - 1) await new Promise(r => setTimeout(r, 120));
    }
  };

  /* ---- bubble ---- */
  let bubbleOpen = false;
  const fillLine = (words) => {
    line.innerHTML = words.map(w => `<span class="w">${w}</span>`).join(' ');
    return [...line.querySelectorAll('.w')];
  };
  const openBubble = (small) => {
    bubble.classList.toggle('small', !!small);
    bubbleOpen = true;
    return anim(bubble, [
      { transform: 'scale(0) rotate(-8deg)', opacity: 0 },
      { transform: 'scale(1.07) rotate(1deg)', opacity: 1, offset: .65 },
      { transform: 'scale(1) rotate(0deg)', opacity: 1 }
    ], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
  };
  const closeBubble = () => {
    if (!bubbleOpen) return Promise.resolve();
    bubbleOpen = false;
    return anim(bubble, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.6)', opacity: 0 }], { duration: 220, easing: 'ease-in' });
  };

  /* ---- voice ---- */
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  const voiceSel = $('voiceSel');
  const soundBtn = $('soundBtn');
  let soundOn = true, voices = [];
  const MALE = /conrad|killian|florian|ralf|bernd|kasper|klaus|jonas|christoph|stefan|markus|martin|yannick|viktor|hans|male|männlich|mann/i;
  const loadVoices = () => {
    if (!synth) return;
    const all = synth.getVoices();
    if (!all.length) return;
    const de = all.filter(v => /^de/i.test(v.lang));
    const rank = (v) => (MALE.test(v.name) ? 0 : 1) + (/natural|neural|online|premium|enhanced/i.test(v.name) ? 0 : 0.5);
    de.sort((a, b) => rank(a) - rank(b));
    const others = all.filter(v => !/^de/i.test(v.lang) && /^en/i.test(v.lang));
    voices = [...de, ...others];
    voiceSel.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})${MALE.test(v.name) ? ' · male' : ''}</option>`).join('');
    if (!de.length) note.textContent = 'This device has no German voice installed, so he will use an English one. Edge on Windows (Conrad, Killian) and Apple devices (Markus, Martin) carry German male voices.';
    else if (!MALE.test(de[0].name)) note.textContent = 'No German male voice found on this device, so the German voice is pitched down. Edge on Windows offers Conrad and Killian.';
    else note.textContent = '';
  };
  if (synth) { loadVoices(); synth.addEventListener?.('voiceschanged', loadVoices); }
  else { voiceSel.innerHTML = '<option>Voice not supported here</option>'; voiceSel.disabled = true; note.textContent = 'This browser cannot speak aloud. The animation still plays.'; }

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    if (!soundOn && synth) synth.cancel();
  });

  // Speaks the line and reveals words in step with the voice. Falls back to a timed reveal.
  const sayLine = (withVoice) => new Promise((resolve) => {
    const spans = fillLine(shown);
    const reveal = (n) => spans.forEach((s, i) => s.classList.toggle('on', i < n));
    let timer = null, n = 0;
    const timed = (step) => { clearInterval(timer); timer = setInterval(() => { reveal(++n); if (n >= spans.length) { clearInterval(timer); } }, step); };
    const finish = () => { clearInterval(timer); reveal(spans.length); resolve(); };
    if (reduce && !withVoice) { reveal(spans.length); return resolve(); }

    if (withVoice && soundOn && synth && voices.length) {
      synth.cancel();
      const text = spoken.join(' ');
      const starts = []; let pos = 0;
      spoken.forEach(w => { starts.push(pos); pos += w.length + 1; });
      const u = new SpeechSynthesisUtterance(text);
      const v = voices[+voiceSel.value || 0];
      u.voice = v; u.lang = v.lang;
      u.rate = 0.9;
      u.pitch = MALE.test(v.name) ? 0.92 : 0.7;
      let gotBoundary = false;
      u.onboundary = (e) => {
        if (e.name && e.name !== 'word') return;
        gotBoundary = true; clearInterval(timer);
        let idx = starts.findIndex(s => s > e.charIndex); if (idx === -1) idx = spoken.length;
        n = Math.max(n, idx); reveal(n);
      };
      u.onend = () => setTimeout(finish, 150);
      u.onerror = () => { timed(150); setTimeout(finish, 150 * spans.length + 200); };
      synth.speak(u);
      setTimeout(() => { if (!gotBoundary) timed(300); }, 700);
      setTimeout(finish, 15000); // safety net
    } else {
      timed(150);
      setTimeout(finish, 150 * spans.length + 100);
    }
  });

  /* ---- phases ---- */
  const phases = {
    async arrive() {
      await closeBubble();
      anim(ground, [{ transform: 'scale(.3)', opacity: .2 }, { transform: 'scale(1)', opacity: 1 }], { duration: 1150, easing: 'ease-out' });
      const wings = flapWings(5, 230, 40);
      await anim(rig, [
        { transform: 'translateY(-70%) rotate(-6deg)', opacity: 0 },
        { transform: 'translateY(-40%) rotate(4deg)', opacity: 1, offset: .35 },
        { transform: 'translateY(-12%) rotate(-3deg)', offset: .75 },
        { transform: 'translateY(0) rotate(0deg)' }
      ], { duration: 1150, easing: 'ease-out' });
      await wings;
      await anim(rig, [
        { transform: 'scale(1,1)' }, { transform: 'scale(1.06,.9)', offset: .3 },
        { transform: 'scale(.98,1.03)', offset: .65 }, { transform: 'scale(1,1)' }
      ], { duration: 420 });
      await blink(1);
    },
    async flap() {
      const body = anim(rig, [
        { transform: 'translateY(0)' }, { transform: 'translateY(-5%)', offset: .25 }, { transform: 'translateY(-2%)', offset: .5 },
        { transform: 'translateY(-6%)', offset: .75 }, { transform: 'translateY(0)' }
      ], { duration: 1200 });
      await flapWings(4, 300, 36);
      await body;
      await anim(rig, [{ transform: 'scale(1)' }, { transform: 'scale(1.04,.94)', offset: .4 }, { transform: 'scale(1)' }], { duration: 300 });
    },
    async hop() {
      for (let i = 0; i < 2; i++) {
        await anim(rig, [
          { transform: 'scale(1,1)' }, { transform: 'scale(1.05,.92)', offset: .18 },
          { transform: 'translateY(-14%) scale(.97,1.04)', offset: .5 },
          { transform: 'translateY(0) scale(1.05,.93)', offset: .82 }, { transform: 'scale(1,1)' }
        ], { duration: 560 });
      }
    },
    async ponder() {
      await anim(head, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-5deg)' }], { duration: 650 });
      await wait(250);
      fillLine(['Hmm…']).forEach(s => s.classList.add('on'));
      await openBubble(true);
      await blink(2);
      await wait(900);
      await anim(head, [{ transform: 'rotate(-5deg)' }, { transform: 'rotate(4deg)' }], { duration: 700 });
      await wait(700);
      await closeBubble();
      await anim(head, [{ transform: 'rotate(4deg)' }, { transform: 'rotate(0deg)' }], { duration: 500 });
    },
    async nein() {
      fillLine(['Nein,', 'nein!']).forEach(s => s.classList.add('on'));
      openBubble(true);
      const shake = anim(head, [
        { transform: 'rotate(0)' }, { transform: 'rotate(-5deg)', offset: .2 }, { transform: 'rotate(5deg)', offset: .4 },
        { transform: 'rotate(-4deg)', offset: .6 }, { transform: 'rotate(3deg)', offset: .8 }, { transform: 'rotate(0)' }
      ], { duration: 1100 });
      const ruffle = anim(rig, [
        { transform: 'translateX(0)' }, { transform: 'translateX(-1.2%)', offset: .25 }, { transform: 'translateX(1.2%)', offset: .5 },
        { transform: 'translateX(-.8%)', offset: .75 }, { transform: 'translateX(0)' }
      ], { duration: 550, iterations: 2 });
      await flapWings(3, 220, 14);
      await Promise.all([shake, ruffle]);
      await wait(700);
      await closeBubble();
    },
    // Wags his (viewer's right) wing like a finger while he speaks.
    async lecture(withVoice = false) {
      await closeBubble();
      await phases.flap();
      await anim(head, [{ transform: 'rotate(0)' }, { transform: 'rotate(3deg)' }], { duration: 300 });
      await openBubble(false);
      const talking = sayLine(withVoice);
      await anim(wingR, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-38deg)' }], { duration: 260 });
      let speaking = true;
      talking.then(() => { speaking = false; });
      while (speaking && !reduce) {
        await Promise.all([
          anim(wingR, [{ transform: 'rotate(-38deg)' }, { transform: 'rotate(-24deg)' }, { transform: 'rotate(-38deg)' }], { duration: 420 }),
          anim(head, [{ transform: 'rotate(3deg)' }, { transform: 'rotate(1deg) translateY(.6%)' }, { transform: 'rotate(3deg)' }], { duration: 420 })
        ]);
      }
      await talking;
      await Promise.all([rest(wingR, 'rotate(0deg)'), rest(head, 'rotate(0deg)')]);
      blink(1);
      await wait(2600);
      await closeBubble();
    }
  };

  /* ---- queue so phases never collide ---- */
  let busy = false;
  const buttons = [...document.querySelectorAll('[data-phase]'), $('speakBtn')];
  const run = async (fn, btn) => {
    if (busy) return;
    busy = true;
    if (btn) btn.setAttribute('aria-pressed', 'true');
    try { await fn(); } finally {
      if (btn) btn.setAttribute('aria-pressed', 'false');
      busy = false;
    }
  };
  document.querySelectorAll('[data-phase]').forEach(b =>
    b.addEventListener('click', () => run(() => phases[b.dataset.phase](), b)));
  const speakBtn = $('speakBtn');
  speakBtn.addEventListener('click', () => {
    if (synth && busy) synth.cancel();
    run(() => phases.lecture(true), speakBtn);
  });
  const owl = $('owl');
  const poke = () => {
    const pick = ['flap', 'hop', 'nein', 'ponder'][Math.floor(Math.random() * 4)];
    run(() => phases[pick]());
  };
  owl.addEventListener('click', poke);
  owl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });

  /* ---- idle blinking ---- */
  const idle = () => { setTimeout(async () => { if (!busy) await blink(Math.random() < .25 ? 2 : 1); idle(); }, 2800 + Math.random() * 3200); };

  /* ---- opening sequence: arrive, flap, then the line (silent until someone taps for sound) ---- */
  run(async () => { await phases.arrive(); await wait(300); await phases.lecture(false); }).then(idle);
})();
</script>
